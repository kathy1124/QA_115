<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>題庫練習系統</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(79,70,229,0.3);
    }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header-sub { font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }
    .header-icon { font-size: 1.8rem; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
    #setup-panel { display: grid; gap: 16px; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .source-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .source-btn {
      padding: 10px 18px;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      background: white;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      color: var(--text-muted);
    }
    .source-btn:hover { border-color: var(--primary); color: var(--primary); }
    .source-btn.active { border-color: var(--primary); background: #EEF2FF; color: var(--primary); }
    .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    .mode-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      background: white;
    }
    .mode-card:hover { border-color: var(--primary); }
    .mode-card.active { border-color: var(--primary); background: #EEF2FF; }
    .mode-icon { font-size: 1.8rem; margin-bottom: 6px; }
    .mode-name { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .mode-desc { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }
    .count-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .count-row label { font-weight: 500; color: var(--text-muted); font-size: 0.9rem; }
    .count-input {
      width: 80px; padding: 8px 12px; border: 2px solid var(--border);
      border-radius: 8px; font-size: 1rem; text-align: center;
      outline: none; transition: border-color 0.2s;
    }
    .count-input:focus { border-color: var(--primary); }
    .total-badge {
      background: #EEF2FF; color: var(--primary);
      padding: 4px 10px; border-radius: 20px;
      font-size: 0.82rem; font-weight: 600;
    }
    .start-btn {
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: white; border: none; padding: 14px 32px;
      border-radius: 10px; font-size: 1.05rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; width: 100%;
      box-shadow: 0 4px 12px rgba(79,70,229,0.35);
    }
    .start-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,70,229,0.45); }
    #quiz-panel { display: none; }
    .quiz-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
    }
    .progress-wrap { flex: 1; min-width: 200px; }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 5px; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #7C3AED); border-radius: 3px; transition: width 0.4s ease; }
    .score-badge { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 0.85rem; font-weight: 600; }
    .score-badge .s-correct { color: var(--success); }
    .score-badge .s-wrong { color: var(--danger); }
    .question-card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px; }
    .q-meta { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .q-tag { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
    .q-tag.source { background: #EEF2FF; color: var(--primary); }
    .q-tag.multi { background: #FEF3C7; color: #92400E; }
    .q-num { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; margin-bottom: 10px; }
    .q-text { font-size: 1.05rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
    .options-list { display: grid; gap: 10px; margin-top: 16px; }
    .option-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 13px 16px; border: 2px solid var(--border);
      border-radius: 10px; cursor: pointer; transition: all 0.2s; background: white;
    }
    .option-item:hover:not(.disabled) { border-color: var(--primary); background: #F5F3FF; }
    .option-item.selected { border-color: var(--primary); background: #EEF2FF; }
    .option-item.correct { border-color: var(--success); background: #D1FAE5; }
    .option-item.wrong { border-color: var(--danger); background: #FEE2E2; }
    .option-item.show-correct { border-color: var(--success); background: #D1FAE5; }
    .option-item.disabled { cursor: default; }
    .opt-letter {
      width: 28px; height: 28px; border-radius: 50%; background: var(--border);
      color: var(--text-muted); display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 0.85rem;
      flex-shrink: 0; transition: all 0.2s;
    }
    .option-item.selected .opt-letter { background: var(--primary); color: white; }
    .option-item.correct .opt-letter { background: var(--success); color: white; }
    .option-item.wrong .opt-letter { background: var(--danger); color: white; }
    .option-item.show-correct .opt-letter { background: var(--success); color: white; }
    .opt-text { font-size: 0.95rem; line-height: 1.5; flex: 1; white-space: pre-wrap; }
    .opt-icon { font-size: 1.1rem; flex-shrink: 0; }
    .feedback-box {
      display: none; margin-top: 14px; padding: 12px 16px;
      border-radius: 8px; font-size: 0.9rem; font-weight: 500; line-height: 1.6;
    }
    .feedback-box.correct { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
    .feedback-box.wrong { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
    .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { padding: 11px 22px; border-radius: 9px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--card); color: var(--text); border: 2px solid var(--border); }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
    .btn-danger { background: white; color: var(--danger); border: 2px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #result-panel { display: none; }
    .result-hero { text-align: center; padding: 32px 20px; }
    .result-emoji { font-size: 4rem; margin-bottom: 12px; }
    .result-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .result-score { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 12px 0; }
    .result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 20px 0; }
    .stat-box { background: var(--card); border-radius: 10px; padding: 16px; text-align: center; border: 1px solid var(--border); }
    .stat-num { font-size: 1.8rem; font-weight: 700; }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .stat-box.correct .stat-num { color: var(--success); }
    .stat-box.wrong .stat-num { color: var(--danger); }
    .stat-box.skip .stat-num { color: var(--warning); }
    .most-wrong-list { margin-top: 18px; }
    .most-wrong-list h3 { font-size: 0.95rem; font-weight: 600; color: var(--danger); margin-bottom: 10px; }
    .most-wrong-item { display: flex; align-items: baseline; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 0.85rem; line-height: 1.5; }
    .most-wrong-count { color: var(--danger); font-weight: 700; white-space: nowrap; }
    .most-wrong-question { flex: 1; }
    .wrong-list { margin-top: 20px; }
    .wrong-list h3 { font-size: 1.05rem; font-weight: 600; color: var(--danger); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .wrong-item { background: var(--card); border-radius: 10px; padding: 16px; margin-bottom: 10px; border: 1px solid var(--border); border-left: 4px solid var(--danger); }
    .wrong-q { font-size: 0.9rem; margin-bottom: 10px; font-weight: 500; line-height: 1.5; white-space: pre-wrap; }
    .wrong-ans { display: flex; gap: 14px; font-size: 0.82rem; flex-wrap: wrap; }
    .wrong-ans .my { color: var(--danger); }
    .wrong-ans .corr { color: var(--success); }
    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .flash-card {
      background: var(--card); border-radius: var(--radius); padding: 40px 32px;
      box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center;
      min-height: 200px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; transition: transform 0.3s;
    }
    .flash-card:hover { transform: scale(1.01); }
    .flash-hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 16px; }
    .flash-answer {
      display: none; margin-top: 20px; padding: 14px;
      background: #D1FAE5; border-radius: 8px; color: #065F46; font-weight: 600;
      white-space: pre-wrap; text-align: left;
    }
    .bookmark-btn { background: none; border: none; cursor: pointer; font-size: 1.3rem; color: var(--text-muted); padding: 4px; transition: transform 0.2s; }
    .bookmark-btn:hover { transform: scale(1.2); }
    .bookmark-btn.bookmarked { color: var(--warning); }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1E293B; color: white; padding: 10px 20px;
      border-radius: 8px; font-size: 0.88rem; transition: transform 0.3s; z-index: 999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease; }
    @media (max-width: 600px) {
      .container { padding: 12px; }
      .question-card { padding: 16px; }
      .q-text { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">&#128218;</div>
  <div>
    <h1>題庫練習系統</h1>
    <div class="header-sub">物件導向 &times; 資訊安全 | &#20849; 897 &#39064;</div>
  </div>
</div>

<div class="container">
  <div id="setup-panel">
    <div class="card">
      <h2>選擇題庫</h2>
      <div class="source-buttons">
        <button class="source-btn active" data-source="all">全部題庫</button>
        <button class="source-btn" data-source="s0">物件導向（237題）</button>
        <button class="source-btn" data-source="s1">資訊安全（660題）</button>
        <button class="source-btn" data-source="bookmarks">&#11088; 我的珍藏</button>
      </div>
    </div>

    <div class="card">
      <h2>&#127918; &#32244;&#32722;&#27169;&#24335;</h2>
      <div class="mode-grid">
        <div class="mode-card active" data-mode="sequential">
          <div class="mode-icon">&#128203;</div>
          <div class="mode-name">順序模式</div>
          <div class="mode-desc">按題號作答</div>
        </div>
        <div class="mode-card" data-mode="random">
          <div class="mode-icon">&#127922;</div>
          <div class="mode-name">隨機模式</div>
          <div class="mode-desc">隨機題目練習</div>
        </div>
        <div class="mode-card" data-mode="wrong">
          <div class="mode-icon">&#127919;</div>
          <div class="mode-name">錯題練習</div>
          <div class="mode-desc">集中練習錯題</div>
        </div>
        <div class="mode-card" data-mode="flash">
          <div class="mode-icon">&#9889;</div>
          <div class="mode-name">字卡模式</div>
          <div class="mode-desc">快速記憶題目與答案</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>&#9881;&#65039; &#35373;&#23450;</h2>
      <div class="count-row">
        <label>&#20316;&#31572;&#39064;&#25976;&#65306;</label>
        <input type="number" class="count-input" id="count-input" value="20" min="1" max="897">
        <span class="total-badge" id="total-badge">&#20849; 897 &#39064;&#21487;&#36984;</span>
        <label style="margin-left:12px">
          <input type="checkbox" id="shuffle-opts"> 隨機順序
        </label>
      </div>
    </div>

    <div class="card" id="stats-card">
      <h2>&#128202; &#25105;&#30340;&#25104;&#32318;</h2>
      <div id="stats-display" style="color:var(--text-muted);font-size:0.9rem;">&#23609;&#28961;&#32244;&#32722;&#35352;&#37636;</div>
      <div id="most-wrong-display" class="most-wrong-list"></div>
    </div>

    <button class="start-btn" id="start-btn">&#128640; &#38283;&#22987;&#32244;&#32722;</button>
  </div>

  <div id="quiz-panel">
    <div class="quiz-header">
      <div class="progress-wrap">
        <div class="progress-text">
          <span id="progress-text">&#39064;&#30446; 1 / 20</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <div class="score-badge">
        &#9989; <span class="s-correct" id="sc-correct">0</span> &nbsp;
        &#10060; <span class="s-wrong" id="sc-wrong">0</span>
      </div>
    </div>

    <div class="question-card fade-in" id="question-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="q-meta" id="q-meta"></div>
        <button class="bookmark-btn" id="bookmark-btn" title="&#25536;&#34255;&#27492;&#39064;">&#9734;</button>
      </div>
      <div class="q-num" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options-list" id="options-list"></div>
      <div class="feedback-box" id="feedback-box"></div>
    </div>

    <div class="flash-card" id="flash-card" style="display:none" onclick="revealFlash()">
      <div class="q-text" id="flash-q-text" style="text-align:center"></div>
      <div class="flash-hint">&#128070; &#40635;&#25793;&#26597;&#30475;&#31572;&#26696;</div>
      <div class="flash-answer" id="flash-answer"></div>
    </div>

    <div class="action-row" id="action-row" style="margin-top:12px">
      <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()">&#30906;&#35469;&#20316;&#31572;</button>
      <button class="btn btn-primary" id="next-btn" style="display:none" onclick="nextQuestion()">&#19979;&#19968;&#39064; &#8594;</button>
      <button class="btn btn-secondary" id="skip-btn" onclick="skipQuestion()">&#36339;&#36942;</button>
      <button class="btn btn-danger" onclick="endQuiz()">&#32080;&#26463;</button>
    </div>
  </div>

  <div id="result-panel">
    <div class="card">
      <div class="result-hero">
        <div class="result-emoji" id="result-emoji">&#127881;</div>
        <div class="result-title" id="result-title">&#32244;&#32722;&#23436;&#25104;&#65281;</div>
        <div class="result-score" id="result-score"></div>
        <div style="color:var(--text-muted);font-size:0.9rem" id="result-sub"></div>
      </div>
      <div class="result-stats">
        <div class="stat-box correct"><div class="stat-num" id="res-correct">0</div><div class="stat-label">&#9989; &#31572;&#23565;</div></div>
        <div class="stat-box wrong"><div class="stat-num" id="res-wrong">0</div><div class="stat-label">&#10060; &#31572;&#37406;</div></div>
        <div class="stat-box skip"><div class="stat-num" id="res-skip">0</div><div class="stat-label">&#9197;&#65039; &#36339;&#36942;</div></div>
        <div class="stat-box"><div class="stat-num" id="res-total">0</div><div class="stat-label">&#128221; &#32317;&#39064;&#25976;</div></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="retryWrong()">&#127919; 練習錯題</button>
        <button class="btn btn-secondary" onclick="retryAll()">&#128260; &#37325;&#26032;&#32244;&#32722;</button>
        <button class="btn btn-secondary" onclick="goHome()">&#127968; 返回主畫面</button>
      </div>
    </div>
    <div class="card wrong-list" id="wrong-list-card" style="margin-top:16px;display:none">
      <h3>&#10060; &#37406;&#35611;&#39064;&#30446;&#22238;&#39287;</h3>
      <div id="wrong-items"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

var _bytes = Uint8Array.from(atob(_raw), function(c){ return c.charCodeAt(0); });
var ALL_QUESTIONS = JSON.parse(new TextDecoder().decode(_bytes));

// Source name mapping
var SOURCE_NAMES = {};
var _sources = [];
ALL_QUESTIONS.forEach(function(q) {
  if (_sources.indexOf(q.source) === -1) _sources.push(q.source);
});
// Map 's0' -> first source, 's1' -> second source
if (_sources[0]) SOURCE_NAMES['s0'] = _sources[0];
if (_sources[1]) SOURCE_NAMES['s1'] = _sources[1];

var state = {
  mode: 'sequential',
  source: 'all',
  count: 20,
  shuffleOpts: false,
  questions: [],
  current: 0,
  answers: {},
  bookmarks: new Set(JSON.parse(localStorage.getItem('qbookmarks') || '[]')),
  wrongBank: new Set(JSON.parse(localStorage.getItem('qwrongBank') || '[]')),
  wrongCounts: JSON.parse(localStorage.getItem('qwrongCounts') || '{}'),
  history: JSON.parse(localStorage.getItem('qhistory') || '[]'),
  flashRevealed: false,
  selectedLetters: []
};

function getPool() {
  var pool = ALL_QUESTIONS;
  if (state.source === 'bookmarks') {
    pool = pool.filter(function(q) { return state.bookmarks.has(q.id); });
  } else if (state.source !== 'all') {
    var srcName = SOURCE_NAMES[state.source];
    if (srcName) pool = pool.filter(function(q) { return q.source === srcName; });
  }
  if (state.mode === 'wrong') {
    pool = pool.filter(function(q) { return state.wrongBank.has(q.id); });
  }
  return pool;
}

function updateBadge() {
  var pool = getPool();
  document.getElementById('total-badge').textContent = '共 ' + pool.length + ' 題可選';
}

document.querySelectorAll('.source-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.source-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.source = btn.dataset.source;
    updateBadge();
  });
});

document.querySelectorAll('.mode-card').forEach(function(card) {
  card.addEventListener('click', function() {
    document.querySelectorAll('.mode-card').forEach(function(c) { c.classList.remove('active'); });
    card.classList.add('active');
    state.mode = card.dataset.mode;
    updateBadge();
  });
});

document.getElementById('count-input').addEventListener('input', function() {
  state.count = parseInt(this.value) || 20;
});

document.getElementById('shuffle-opts').addEventListener('change', function() {
  state.shuffleOpts = this.checked;
});

function showStats() {
  var h = state.history;
  var statsDisplay = document.getElementById('stats-display');
  if (h.length === 0) {
    statsDisplay.textContent = '尚無練習記錄';
  } else {
    var totalQ = h.reduce(function(a, b) { return a + b.total; }, 0);
    var totalCorrect = h.reduce(function(a, b) { return a + b.correct; }, 0);
    var avgScore = totalQ > 0 ? Math.round(totalCorrect / totalQ * 100) : 0;
    statsDisplay.innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px">' +
      '<div><strong style="font-size:1.4rem;color:var(--primary)">' + h.length + '</strong><br>練習次數</div>' +
      '<div><strong style="font-size:1.4rem;color:var(--primary)">' + totalQ + '</strong><br>累計作答</div>' +
      '<div><strong style="font-size:1.4rem;color:var(--success)">' + avgScore + '%</strong><br>平均正確率</div>' +
      '<div><strong style="font-size:1.4rem;color:var(--warning)">' + state.wrongBank.size + '</strong><br>錯題存庫</div>' +
      '</div>';
  }

  var mostWrongDisplay = document.getElementById('most-wrong-display');
  mostWrongDisplay.innerHTML = '';
  var mostWrong = Object.keys(state.wrongCounts)
    .map(function(id) {
      var question = ALL_QUESTIONS.find(function(q) { return String(q.id) === id; });
      return question ? { question: question, count: state.wrongCounts[id] } : null;
    })
    .filter(function(item) { return item && item.count > 0; })
    .sort(function(a, b) { return b.count - a.count; })
    .slice(0, 5);
  if (mostWrong.length === 0) return;

  var heading = document.createElement('h3');
  heading.textContent = '答錯次數最多的題目';
  mostWrongDisplay.appendChild(heading);
  mostWrong.forEach(function(item) {
    var row = document.createElement('div');
    row.className = 'most-wrong-item';
    var count = document.createElement('span');
    count.className = 'most-wrong-count';
    count.textContent = item.count + ' 次';
    var question = document.createElement('span');
    question.className = 'most-wrong-question';
    question.textContent = 'Q' + item.question.number + '. ' + item.question.question;
    row.appendChild(count);
    row.appendChild(question);
    mostWrongDisplay.appendChild(row);
  });
}
showStats();

document.getElementById('start-btn').addEventListener('click', startQuiz);

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function startQuiz() {
  var pool = getPool();
  if (pool.length === 0) {
    showToast('沒有可用題目，請檢查選擇的題庫或模式');
    return;
  }
  var questions;
  if (state.mode === 'sequential') {
    questions = pool.slice(0, state.count);
  } else {
    questions = shuffle(pool).slice(0, Math.min(state.count, pool.length));
  }
  if (state.shuffleOpts) {
    questions = questions.map(function(q) {
      return Object.assign({}, q, { options: shuffle(q.options) });
    });
  }
  state.questions = questions;
  state.current = 0;
  state.answers = {};
  state.selectedLetters = [];
  state.flashRevealed = false;
  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('quiz-panel').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  var q = state.questions[state.current];
  var total = state.questions.length;
  var idx = state.current;
  var pct = Math.round(idx / total * 100);

  document.getElementById('progress-text').textContent = '題目 ' + (idx+1) + ' / ' + total;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  var correct = 0, wrong = 0;
  Object.values(state.answers).forEach(function(a) {
    if (a.correct) correct++;
    else if (!a.skipped) wrong++;
  });
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;

  if (state.mode === 'flash') {
    renderFlash(q); return;
  }

  document.getElementById('flash-card').style.display = 'none';
  document.getElementById('question-card').style.display = 'block';

  var srcDisplay = q.source.replace('_完整解答版','').replace('_解析','');
  var metaHtml = '<span class="q-tag source">' + srcDisplay + '</span>';
  if (q.multiCorrect) metaHtml += '<span class="q-tag multi">多選題</span>';
  document.getElementById('q-meta').innerHTML = metaHtml;
  document.getElementById('q-num').textContent = '第 ' + q.number + ' 題';
  document.getElementById('q-text').textContent = q.question;

  var bBtn = document.getElementById('bookmark-btn');
  bBtn.textContent = state.bookmarks.has(q.id) ? '★' : '☆';
  bBtn.className = 'bookmark-btn' + (state.bookmarks.has(q.id) ? ' bookmarked' : '');
  bBtn.onclick = function() { toggleBookmark(q.id); };

  var optsList = document.getElementById('options-list');
  optsList.innerHTML = '';
  q.options.forEach(function(opt) {
    var div = document.createElement('div');
    div.className = 'option-item';
    div.dataset.letter = opt.letter;
    var letterDiv = document.createElement('div');
    letterDiv.className = 'opt-letter';
    letterDiv.textContent = opt.letter;
    var textDiv = document.createElement('div');
    textDiv.className = 'opt-text';
    textDiv.textContent = opt.text;
    var iconDiv = document.createElement('div');
    iconDiv.className = 'opt-icon';
    div.appendChild(letterDiv);
    div.appendChild(textDiv);
    div.appendChild(iconDiv);
    div.addEventListener('click', function() { selectOption(div, q); });
    optsList.appendChild(div);
  });

  document.getElementById('feedback-box').style.display = 'none';
  document.getElementById('feedback-box').className = 'feedback-box';
  document.getElementById('submit-btn').style.display = '';
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('skip-btn').style.display = '';
  state.selectedLetters = [];
}

function renderFlash(q) {
  document.getElementById('question-card').style.display = 'none';
  document.getElementById('flash-card').style.display = 'flex';
  state.flashRevealed = false;
  document.getElementById('flash-q-text').textContent = q.question;
  document.getElementById('flash-answer').style.display = 'none';
  document.getElementById('submit-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = '';
  document.getElementById('skip-btn').style.display = 'none';
}

function revealFlash() {
  if (state.flashRevealed) return;
  state.flashRevealed = true;
  var q = state.questions[state.current];
  var correctOpts = q.options.filter(function(o) { return q.correct.indexOf(o.letter) !== -1; });
  var ansText = correctOpts.map(function(o) { return o.letter + '. ' + o.text; }).join('\n');
  var ansEl = document.getElementById('flash-answer');
  ansEl.textContent = '正確答案：\n' + ansText;
  ansEl.style.display = 'block';
}

function selectOption(div, q) {
  if (div.classList.contains('disabled')) return;
  if (!q.multiCorrect) {
    document.querySelectorAll('.option-item').forEach(function(el) { el.classList.remove('selected'); });
    state.selectedLetters = [div.dataset.letter];
    div.classList.add('selected');
  } else {
    var letter = div.dataset.letter;
    var idx2 = state.selectedLetters.indexOf(letter);
    if (idx2 !== -1) {
      div.classList.remove('selected');
      state.selectedLetters.splice(idx2, 1);
    } else {
      div.classList.add('selected');
      state.selectedLetters.push(letter);
    }
  }
  document.getElementById('submit-btn').disabled = state.selectedLetters.length === 0;
}

function submitAnswer() {
  var q = state.questions[state.current];
  var selected = state.selectedLetters.slice();
  var correct = q.correct;
  var isCorrect = selected.length === correct.length &&
    selected.every(function(l) { return correct.indexOf(l) !== -1; }) &&
    correct.every(function(l) { return selected.indexOf(l) !== -1; });

  state.answers[state.current] = { selected: selected, correct: isCorrect, skipped: false };

  if (!isCorrect) state.wrongBank.add(q.id);
  else state.wrongBank.delete(q.id);
  localStorage.setItem('qwrongBank', JSON.stringify(Array.from(state.wrongBank)));
  if (!isCorrect) {
    var questionKey = String(q.id);
    state.wrongCounts[questionKey] = (state.wrongCounts[questionKey] || 0) + 1;
    localStorage.setItem('qwrongCounts', JSON.stringify(state.wrongCounts));
  }

  document.querySelectorAll('.option-item').forEach(function(el) {
    el.classList.add('disabled');
    var letter = el.dataset.letter;
    var isSel = selected.indexOf(letter) !== -1;
    var isCorr = correct.indexOf(letter) !== -1;
    if (isCorr && isSel) el.classList.add('correct');
    else if (!isCorr && isSel) el.classList.add('wrong');
    else if (isCorr && !isSel) el.classList.add('show-correct');
    el.querySelector('.opt-icon').textContent = isCorr ? '✅' : (isSel ? '❌' : '');
  });

  var fb = document.getElementById('feedback-box');
  if (isCorrect) {
    fb.className = 'feedback-box correct';
    fb.textContent = '✅ 正確！';
  } else {
    fb.className = 'feedback-box wrong';
    var corrText = q.options.filter(function(o) { return correct.indexOf(o.letter) !== -1; })
      .map(function(o) { return o.letter + '. ' + o.text; }).join('、');
    fb.textContent = '❌ 答錯了！正確答案：' + corrText;
  }
  fb.style.display = 'block';

  document.getElementById('submit-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = '';
  document.getElementById('skip-btn').style.display = 'none';
  state.selectedLetters = [];
}

function skipQuestion() {
  state.answers[state.current] = { selected: [], correct: false, skipped: true };
  nextQuestion();
}

function nextQuestion() {
  if (state.current + 1 >= state.questions.length) {
    endQuiz(); return;
  }
  state.current++;
  renderQuestion();
}

function endQuiz() {
  if (state.mode === 'flash') { goHome(); return; }
  var answers = state.answers;
  var total = state.questions.length;
  var answered = Object.keys(answers).length;
  var correct = 0, skipped = 0;
  Object.values(answers).forEach(function(a) {
    if (a.correct) correct++;
    if (a.skipped) skipped++;
  });
  var attempted = answered - skipped;
  var wrong = attempted - correct;
  var score = attempted > 0 ? Math.round(correct / attempted * 100) : 0;

  state.history.push({ total: attempted, correct: correct, date: new Date().toISOString() });
  if (state.history.length > 50) state.history.shift();
  localStorage.setItem('qhistory', JSON.stringify(state.history));

  document.getElementById('quiz-panel').style.display = 'none';
  document.getElementById('result-panel').style.display = 'block';

  var emoji = '😢', title = '再接再厲！';
  if (score >= 90) { emoji = '🏆'; title = '太厲害了！'; }
  else if (score >= 80) { emoji = '🎉'; title = '非常好！'; }
  else if (score >= 70) { emoji = '👍'; title = '不錯喔！'; }
  else if (score >= 60) { emoji = '😊'; title = '繼續加油！'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-score').textContent = score + '%';
  document.getElementById('result-sub').textContent = '正確率 ' + score + '%（' + correct + '/' + attempted + '題）';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-skip').textContent = skipped;
  document.getElementById('res-total').textContent = total;

  var wrongItems = document.getElementById('wrong-items');
  wrongItems.innerHTML = '';
  var hasWrong = false;
  state.questions.forEach(function(q, idx) {
    var ans = answers[idx];
    if (!ans || ans.correct || ans.skipped) return;
    hasWrong = true;
    var corrText = q.options.filter(function(o) { return q.correct.indexOf(o.letter) !== -1; })
      .map(function(o) { return o.letter + '. ' + o.text; }).join('、');
    var myText = ans.selected.length > 0 ? ans.selected.map(function(l) {
      var o = q.options.find(function(x) { return x.letter === l; });
      return o ? l + '. ' + o.text : l;
    }).join('、') : '（未作答）';
    var div = document.createElement('div');
    div.className = 'wrong-item';
    var qDiv = document.createElement('div');
    qDiv.className = 'wrong-q';
    qDiv.textContent = 'Q' + q.number + '. ' + q.question;
    var ansDiv = document.createElement('div');
    ansDiv.className = 'wrong-ans';
    ansDiv.innerHTML = '<span class="my">❌ 我的答案：' + myText + '</span>' +
      '<span class="corr">✅ 正確答案：' + corrText + '</span>';
    div.appendChild(qDiv);
    div.appendChild(ansDiv);
    wrongItems.appendChild(div);
  });
  document.getElementById('wrong-list-card').style.display = hasWrong ? 'block' : 'none';
}

function retryWrong() {
  state.mode = 'wrong';
  document.querySelectorAll('.mode-card').forEach(function(c) { c.classList.remove('active'); });
  document.querySelector('[data-mode="wrong"]').classList.add('active');
  startQuiz();
}
function retryAll() { startQuiz(); }
function goHome() {
  document.getElementById('quiz-panel').style.display = 'none';
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('setup-panel').style.display = 'grid';
  showStats();
  updateBadge();
}

function toggleBookmark(qId) {
  if (state.bookmarks.has(qId)) {
    state.bookmarks.delete(qId);
    showToast('已取消收藏');
  } else {
    state.bookmarks.add(qId);
    showToast('⭐ 已加入收藏');
  }
  localStorage.setItem('qbookmarks', JSON.stringify(Array.from(state.bookmarks)));
  var bBtn = document.getElementById('bookmark-btn');
  var q = state.questions[state.current];
  bBtn.textContent = state.bookmarks.has(q.id) ? '★' : '☆';
  bBtn.className = 'bookmark-btn' + (state.bookmarks.has(q.id) ? ' bookmarked' : '');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

document.addEventListener('keydown', function(e) {
  if (document.getElementById('quiz-panel').style.display === 'none') return;
  if (state.mode === 'flash') {
    if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); nextQuestion(); }
    if (e.key === 'Enter') { e.preventDefault(); revealFlash(); }
    return;
  }
  var nextBtn = document.getElementById('next-btn');
  var submitBtn = document.getElementById('submit-btn');
  if ((e.key === 'ArrowRight' || e.key === 'Enter') && nextBtn.style.display !== 'none') {
    e.preventDefault(); nextQuestion();
  } else if (e.key === 'Enter' && !submitBtn.disabled && submitBtn.style.display !== 'none') {
    e.preventDefault(); submitAnswer();
  }
  var keyMap = {'a':'A','b':'B','c':'C','d':'D'};
  if (keyMap[e.key.toLowerCase()]) {
    var opt = document.querySelector('.option-item[data-letter="' + keyMap[e.key.toLowerCase()] + '"]');
    if (opt && !opt.classList.contains('disabled')) opt.click();
  }
});

window.revealFlash = revealFlash;
updateBadge();
</script>
